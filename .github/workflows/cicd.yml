name: CI-CD RiskBot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      modelo:
        description: "Modelo a evaluar (vacío = el de producción). No despliega."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluacion_y_despliegue:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Instalar dependencias (producción + test)
        run: pip install -r requirements-test.txt

      - name: Pruebas sin red (pytest)   # falla rápido y sin gastar cuota del proveedor
        run: python -m pytest -q tests

      - name: Evaluar (eval.py)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVAL_MODEL: ${{ github.event.inputs.modelo }}
          EVAL_PAUSA_SEG: "9"            # plan gratuito: 15 peticiones/minuto por modelo
          RAGAS_LLM: gemini-3.1-flash-lite
        run: python eval.py

      #- name: Guardar historial MLflow
      #  if: always()                     # también cuando falla: es la evidencia del bloqueo
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: mlruns
      #    path: mlruns
      #    if-no-files-found: warn
        
      - name: Guardar historial MLflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow
          path: |
            mlflow.db
            mlruns
          if-no-files-found: warn


      - name: Despliegue a Producción (Render Deploy Hook)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS --retry 3 -X POST "$RENDER_DEPLOY_HOOK"
